<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard - Anna University</title>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f0f5f7;
  min-height: 100vh;
}

.header {
  background: linear-gradient(135deg, #17a2a2 0%, #1db8b8 100%);
  color: white;
  padding: 20px;
  font-size: 22px;
  text-align: center;
  font-weight: 600;
  box-shadow: 0 4px 10px rgba(23,162,162,0.3);
}

.header-content {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
}

.header-content div:first-child {
  font-size: 24px;
}

.menu-bar {
  background: white;
  padding: 0;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  border-bottom: 2px solid #17a2a2;
}

.menu-bar a {
  text-decoration: none;
}

.menu-bar button {
  margin: 0;
  padding: 15px 25px;
  font-size: 14px;
  font-weight: 600;
  background: white;
  color: #17a2a2;
  border: none;
  border-right: 1px solid #ddd;
  cursor: pointer;
  transition: all 0.3s;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.menu-bar button:last-child {
  border-right: none;
}

.menu-bar button:hover {
  background: #f0f5f7;
  color: #148f8f;
  box-shadow: 0 2px 5px rgba(23,162,162,0.2);
}

.menu-bar a:last-child button:hover {
  background: #ffe5e5;
  color: #c92a2a;
}

.content {
  padding: 40px 20px;
  text-align: center;
  max-width: 900px;
  margin: 0 auto;
}

.content h2 {
  color: #17a2a2;
  font-size: 28px;
  margin-bottom: 20px;
  font-weight: 600;
}

.content p {
  color: #555;
  font-size: 16px;
  line-height: 1.8;
}

.welcome-box {
  background: white;
  padding: 30px;
  border-radius: 8px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  border-top: 4px solid #17a2a2;
  margin-top: 20px;
}

.footer {
  margin-top: 40px;
  background: #17a2a2;
  color: white;
  text-align: center;
  padding: 15px;
  font-size: 12px;
}

</style>

</head>

<body>

<div class="header">
<div class="header-content">
  <div>🎓</div>
  <div>Anna University Student Portal</div>
  <div>📋</div>
</div>
</div>

<div class="menu-bar">
<a href="profile.html"><button>👤 Profile</button></a>
<button>📚 Exam Schedule</button>
<a href="result.html"><button>📊 Exam Results</button></a>
<a href="index.html"><button style="color: #c92a2a;">🚪 Logout</button></a>
</div>

<div class="content">
<div class="welcome-box">
  <h2>Welcome, BALA SELVA RAJA</h2>
  <p>This is your student dashboard. You can access your academic information, exam schedules, results, and other important documents from this portal.</p>
</div>
</div>

<div class="footer">
Designed and developed by National Informatics Centre, Chennai
</div>

</body>
</html>
